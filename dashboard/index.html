<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TritonDash</title>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --border: #E3E6EB;
    --border-strong: #CDD2DA;
    --text: #12151B;
    --muted: #5D6675;
    --hint: #9AA3B2;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
    --focus: #2563EB;

    --class: #2563EB;
    --class-bg: #E8F0FE;
    --class-text: #1D4ED8;
    --extra: #EA580C;
    --extra-bg: #FFEFE4;
    --extra-text: #B4470A;

    --danger: #D92D20;
    --danger-bg: #FEF0EE;
    --danger-border: #F8CFC9;
    --warn-bg: #FFF4DB;
    --warn-text: #9A5B00;
    --ok: #16A34A;
  }
  [data-theme="dark"] {
    --bg: #0C0E13;
    --surface: #14171E;
    --surface-2: #1C202A;
    --border: #272C38;
    --border-strong: #363D4C;
    --text: #ECEEF3;
    --muted: #9AA3B2;
    --hint: #66707F;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --focus: #6EA0FF;

    --class: #6EA0FF;
    --class-bg: #17274A;
    --class-text: #A6C4FF;
    --extra: #FB923C;
    --extra-bg: #3B2411;
    --extra-text: #FDBA74;

    --danger: #F97066;
    --danger-bg: #3A1714;
    --danger-border: #6B2420;
    --warn-bg: #3A2C0E;
    --warn-text: #FDB022;
    --ok: #4ADE80;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { max-width: 1100px; margin: 0 auto; padding: 28px 24px 56px; }

  /* Top bar */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  .brand .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  /* The details panel floats over the page, so nothing below or beside it ever moves. */
  .brand { position: relative; flex: 1 1 280px; min-width: 0; }
  .brand .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; min-height: 24px; }
  .sync-summary { font: inherit; font-size: 12px; line-height: 1.3; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .sync-summary:hover { background: var(--surface-2); color: var(--text); }
  .sync-summary b { color: var(--ok); font-weight: 600; }
  .sync-summary.bad { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-border); }
  .sync-report { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; display: flex; flex-direction: column; gap: 6px; width: min(560px, calc(100vw - 32px)); padding: 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28); }
  .sync-report[hidden] { display: none; }
  .sync-chip { display: block; font-size: 12.5px; line-height: 1.45; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--muted); }
  .sync-chip.ok b { color: var(--ok); }
  .sync-chip.bad { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-border); }
  .sync-chip.warn { color: var(--warn-text); background: var(--warn-bg); border-color: transparent; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 0 0 auto; }

  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: 0.88; background: var(--text); }
  .btn.ghost { box-shadow: none; background: transparent; color: var(--muted); }
  .btn.small { padding: 4px 9px; font-size: 12px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; }
  .card + .card, .card + .view, .view + .card { margin-top: 14px; }
  .card h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; }
  .count:empty { display: none; }

  /* Quick add */
  .quick-add { display: grid; grid-template-columns: 1fr 170px 150px auto; gap: 8px; align-items: center; padding: 12px; }
  .field {
    background: var(--surface-2); border: 1px solid transparent; border-radius: 9px;
    padding: 8px 11px; width: 100%; min-width: 0;
  }
  .field:focus { border-color: var(--focus); outline: none; background: var(--surface); }
  .field::placeholder { color: var(--hint); }

  /* Tag panel */
  .tags-panel .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tag-group + .tag-group { margin-top: 12px; }
  .tag-group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--hint); margin-bottom: 6px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; min-height: 34px; padding: 2px; border-radius: 10px; }
  .tag-row.drop-end { outline: 2px dashed var(--border-strong); outline-offset: 1px; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border-radius: 999px;
    border: 1px solid transparent; font-weight: 500; font-size: 13px; position: relative; user-select: none;
  }
  .tag-chip.class { background: var(--class-bg); color: var(--class-text); }
  .tag-chip.extra { background: var(--extra-bg); color: var(--extra-text); }
  .tag-chip[data-action="filter-tag"] { cursor: pointer; }
  .tag-chip.active.class { border-color: var(--class); }
  .tag-chip.active.extra { border-color: var(--extra); }
  .tag-chip.dragging, .class-card.dragging { opacity: 0.4; }
  .tag-chip.drop-before::before, .tag-chip.drop-after::after,
  .class-card.drop-before::before, .class-card.drop-after::after {
    content: ""; position: absolute; top: -2px; bottom: -2px; width: 3px; border-radius: 2px; background: var(--focus);
  }
  .tag-chip.drop-before::before, .class-card.drop-before::before { left: -6px; }
  .tag-chip.drop-after::after, .class-card.drop-after::after { right: -6px; }
  .grip { color: var(--hint); cursor: grab; font-size: 11px; letter-spacing: -2px; }
  .tag-chip .tag-count { font-size: 11.5px; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .tag-input, .new-tag-input {
    background: var(--surface); border: 1px solid var(--focus); border-radius: 6px; padding: 1px 6px;
    font-weight: 500; color: var(--text); min-width: 4ch;
  }
  .tag-input:not(:focus) { border-color: var(--border-strong); }
  .tag-x { border: 0; background: transparent; color: inherit; opacity: 0.6; font-size: 15px; line-height: 1; padding: 0 2px; }
  .tag-x:hover { opacity: 1; color: var(--danger); }
  .tag-add { border: 1px dashed var(--border-strong); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .tag-add:hover { color: var(--text); border-color: var(--muted); }
  .empty-hint { color: var(--muted); font-size: 13px; padding: 6px 2px; }

  /* Tasks */
  .task-list { display: flex; flex-direction: column; }
  .task {
    display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 9px; position: relative;
  }
  .task + .task { border-top: 1px solid var(--border); }
  .task:hover { background: var(--surface-2); }
  .task.dragging { opacity: 0.4; }
  .task.drop-above::before, .task.drop-below::after {
    content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--focus); border-radius: 2px;
  }
  .task.drop-above::before { top: -1px; }
  .task.drop-below::after { bottom: -1px; }
  .task .grip { flex: none; }
  .check {
    flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-strong);
    background: transparent; padding: 0; position: relative;
  }
  .check:hover { border-color: var(--ok); }
  .check.checked { background: var(--ok); border-color: var(--ok); }
  .check.checked::after { content: ""; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .task-name { flex: 1; min-width: 0; cursor: text; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task.done .task-name { color: var(--hint); text-decoration: line-through; }
  .task-name-input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--focus); border-radius: 6px; padding: 3px 8px; }
  .link-slot { flex: none; width: 18px; text-align: center; }
  .open-link { flex: none; color: var(--hint); text-decoration: none; font-size: 13px; padding: 0 2px; }
  .open-link:hover { color: var(--focus); }
  .x { flex: none; border: 0; background: transparent; color: var(--hint); font-size: 17px; line-height: 1; padding: 2px 6px; border-radius: 6px; opacity: 0; }
  .task:hover .x, .x:focus-visible { opacity: 1; }
  .x:hover { color: var(--danger); background: var(--danger-bg); }

  .pill { flex: none; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; cursor: pointer; }
  .pill.tag-class { background: var(--class-bg); color: var(--class-text); }
  .pill.tag-extra { background: var(--extra-bg); color: var(--extra-text); }
  .pill-overdue { background: var(--danger-bg); color: var(--danger); }
  .pill-today { background: var(--warn-bg); color: var(--warn-text); }
  .pill-week { background: var(--surface-2); color: var(--text); }
  .pill-later { background: transparent; color: var(--muted); }
  .inline-date, .inline-select { background: var(--surface); border: 1px solid var(--focus); border-radius: 6px; padding: 2px 6px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 13px; }

  /* Timeline view */
  .banner { background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: 14px; padding: 14px 18px; margin-bottom: 14px; }
  .banner h2 { color: var(--danger); margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .banner .count { background: var(--surface); color: var(--danger); }
  .banner .task:hover { background: var(--surface); }
  .banner .task + .task { border-color: var(--danger-border); }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
  .split .card { min-width: 0; }
  .split .card { margin-top: 0; }
  .split h2, .tabs-card h2 { margin-bottom: 8px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .tab { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; font-weight: 500; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }

  /* By class view */
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .fchip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; }
  .fchip:hover { color: var(--text); }
  .fchip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .fchip .n { margin-left: 5px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--hint); margin: 0 2px 8px; }
  .groups { display: flex; gap: 14px; align-items: flex-start; }
  .groups + .groups { margin-top: 18px; }
  .groups.stacked { flex-direction: column; align-items: stretch; gap: 18px; }
  .group { min-width: 0; }
  .cards-row { display: flex; flex-wrap: wrap; gap: 14px; padding: 2px; border-radius: 14px; min-height: 40px; }
  .cards-row .class-card { flex: 1 1 calc((100% - (var(--c, 1) - 1) * 14px) / var(--c, 1)); min-width: 0; }
  .cards-row.drop-end { outline: 2px dashed var(--border-strong); outline-offset: 2px; }
  .class-card { min-width: 0; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; border-top: 3px solid var(--class); }
  .class-card.extra { border-top-color: var(--extra); }
  .class-card.other { border-top-color: var(--hint); }
  .card-head { display: flex; align-items: center; gap: 6px; padding: 11px 12px 6px 14px; cursor: grab; }
  .card-head .name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; white-space: nowrap; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
  .badge.overdue { background: var(--danger-bg); color: var(--danger); }
  .badge.open { background: var(--surface-2); color: var(--muted); }
  .card-body { padding: 0 10px 8px; }
  .later-toggle { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); font-size: 12.5px; padding: 8px 6px; border-radius: 8px; }
  .later-toggle:hover { background: var(--surface-2); color: var(--text); }
  .card-foot { padding: 4px 10px 12px; }
  .card-add { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; padding: 5px 6px; border-radius: 8px; }
  .card-add:hover { background: var(--surface-2); color: var(--text); }
  .card-form { display: grid; grid-template-columns: 1fr 135px auto; gap: 6px; align-items: center; padding: 4px 4px 0; }
  .card-empty { color: var(--hint); font-size: 13px; padding: 10px 8px; }

  /* Calendar view */
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .cal-head h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; flex: 1; }
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11.5px; font-weight: 600; color: var(--hint); text-align: left; padding: 0 2px 6px; }
  .cal-dow span { padding-left: 8px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
  .cal-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 104px; padding: 5px 5px 4px; cursor: pointer; min-width: 0; }
  .cal-cell:hover { background: var(--surface-2); }
  .cal-cell.other { background: var(--bg); }
  .cal-cell.other .cal-num { color: var(--hint); }
  .cal-cell.selected { box-shadow: inset 0 0 0 2px var(--focus); }
  .cal-cell.drop-target { background: var(--class-bg); }
  .cal-num { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 11px; font-size: 12px; font-weight: 600; margin-bottom: 3px; padding: 0 4px; }
  .cal-cell.today .cal-num { background: var(--text); color: var(--bg); }
  .cal-chip {
    display: block; font-size: 11.5px; line-height: 1.25; padding: 2px 6px; border-radius: 5px; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: grab;
  }
  .cal-chip.tag-class { background: var(--class-bg); color: var(--class-text); }
  .cal-chip.tag-extra { background: var(--extra-bg); color: var(--extra-text); }
  .cal-chip.late { background: var(--danger-bg); color: var(--danger); }
  .cal-chip.done { opacity: 0.5; text-decoration: line-through; }
  .cal-chip b { font-weight: 650; margin-right: 4px; }
  .cal-more { font-size: 11px; color: var(--muted); padding: 0 6px; }
  .day-panel .day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .day-form { display: grid; grid-template-columns: 1fr 170px auto; gap: 8px; margin-top: 12px; }

  .footer { display: flex; gap: 8px; margin-top: 24px; align-items: center; flex-wrap: wrap; }
  .footer .hint { color: var(--hint); font-size: 12px; margin-left: auto; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 10; }

  /* In cards the open-link and delete buttons float over the row on hover, so names keep the space. */
  @media (min-width: 701px) {
    .class-card .task { gap: 8px; padding: 7px 4px; }
    .class-card .task .link-slot, .class-card .task .x {
      position: absolute; top: 50%; transform: translateY(-50%); opacity: 0; background: var(--surface-2); height: 24px; line-height: 24px;
    }
    .class-card .task .x { right: 4px; }
    .class-card .task .link-slot { right: 30px; width: 24px; border-radius: 6px; }
    .class-card .task:hover .link-slot, .class-card .task:focus-within .link-slot { opacity: 1; }
  }

  @media (max-width: 700px) {
    .app { padding: 18px 14px 40px; }
    .actions { width: 100%; }
    .seg { flex: 1 1 100%; }
    .seg button { flex: 1; }
    .quick-add { grid-template-columns: 1fr 1fr; }
    .quick-add .field:first-child, .quick-add .btn { grid-column: 1 / -1; }
    .split { grid-template-columns: minmax(0, 1fr); }
    .card-form, .day-form { grid-template-columns: 1fr 1fr; }
    .card-form .field:first-child, .day-form .field:first-child { grid-column: 1 / -1; }
    .task .pill.tag-class, .task .pill.tag-extra { display: none; }
    .x { opacity: 1; }
    .cal-cell { min-height: 54px; padding: 3px; }
    .cal-chip { height: 6px; width: 6px; padding: 0; border-radius: 50%; display: inline-block; font-size: 0; margin: 0 2px 0 0; }
    .cal-chip.tag-class { background: var(--class); }
    .cal-chip.tag-extra { background: var(--extra); }
    .cal-chip.late { background: var(--danger); }
    .cal-chip b, .cal-more { display: none; }
    .cal-dow span { padding-left: 2px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <h1>TritonDash</h1>
      <p class="sub">
        <span id="canvas-sync-status"></span>
        <button class="sync-summary" id="sync-summary" data-action="sync-details" aria-expanded="false" aria-controls="sync-report" hidden></button>
      </p>
      <div class="sync-report" id="sync-report" role="status" aria-live="polite" hidden></div>
    </div>
    <div class="actions">
      <div class="seg" id="view-switch" role="group" aria-label="View">
        <button data-action="set-view" data-view="timeline">Timeline</button>
        <button data-action="set-view" data-view="classes">By class</button>
        <button data-action="set-view" data-view="calendar">Calendar</button>
      </div>
      <button class="btn" id="refresh-btn" data-action="refresh" title="Check Canvas for new assignments">Refresh</button>
      <button class="btn" id="theme-toggle" data-action="theme" title="Toggle theme"><span id="theme-icon">☀</span> <span id="theme-label">Light</span></button>
    </div>
  </header>

  <form class="card quick-add" data-form="quick-add">
    <input class="field" type="text" name="name" placeholder="Add a task" autocomplete="off">
    <select class="field" name="tag" id="new-tag" aria-label="Class or extracurricular"></select>
    <input class="field" type="date" name="date" id="new-date" aria-label="Due date">
    <button class="btn primary" type="submit">Add</button>
  </form>

  <section class="card tags-panel" id="tags-panel">
    <div class="panel-head">
      <h2>Classes and extracurriculars <span id="filter-note"></span></h2>
      <div>
        <button class="btn small ghost" data-action="clear-filter" id="clear-filter" hidden>Clear filter</button>
        <button class="btn small" data-action="edit-tags" id="edit-tags">Edit</button>
      </div>
    </div>
    <div class="tag-group">
      <div class="tag-group-label">Classes</div>
      <div class="tag-row" id="class-tags" data-group="class"></div>
    </div>
    <div class="tag-group">
      <div class="tag-group-label">Extracurriculars</div>
      <div class="tag-row" id="extra-tags" data-group="extra"></div>
    </div>
  </section>

  <!-- Timeline -->
  <main class="view" id="view-timeline" style="margin-top:14px">
    <section class="banner" id="overdue-section" hidden>
      <h2>Overdue <span class="count" id="overdue-count"></span></h2>
      <div class="task-list" id="overdue-list"></div>
    </section>
    <div class="split">
      <section class="card">
        <h2>Due today <span class="count" id="today-count"></span></h2>
        <div class="task-list" id="today-list"></div>
      </section>
      <section class="card">
        <h2>Next 7 days <span class="count" id="week-count"></span></h2>
        <div class="task-list" id="week-list"></div>
      </section>
    </div>
    <section class="card tabs-card">
      <div class="tabs" id="secondary-tabs">
        <button class="tab" data-action="set-tab" data-filter="later">Later</button>
        <button class="tab" data-action="set-tab" data-filter="done">Done</button>
        <button class="tab" data-action="set-tab" data-filter="all">All open</button>
      </div>
      <div class="task-list" id="secondary-list"></div>
    </section>
  </main>

  <!-- By class -->
  <main class="view" id="view-classes" style="margin-top:14px">
    <div class="filter-chips" id="class-filters"></div>
    <div id="class-cards"></div>
  </main>

  <!-- Calendar -->
  <main class="view" id="view-calendar" style="margin-top:14px">
    <section class="card">
      <div class="cal-head">
        <h2 id="cal-title"></h2>
        <button class="btn small" data-action="cal-prev" aria-label="Previous month">‹</button>
        <button class="btn small" data-action="cal-today">Today</button>
        <button class="btn small" data-action="cal-next" aria-label="Next month">›</button>
      </div>
      <div class="cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>
    <section class="card day-panel" id="day-panel"></section>
  </main>

  <div class="footer">
    <button class="btn small" data-action="export">Export backup</button>
    <button class="btn small" data-action="import">Import backup</button>
    <button class="btn small" data-action="restore-backup" title="Replace this browser's tasks with the latest copy the helper saved on your computer">Restore from backup</button>
    <input type="file" id="import-file" accept=".json" hidden>
    <span class="hint">Click a task to edit it. Drag to reorder.</span>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="canvas_tasks.js" onerror="void 0"></script>
<script>
(function () {
  "use strict";

  const STORAGE_TASKS = "school_dashboard_tasks";
  const STORAGE_CATEGORIES = "school_dashboard_categories";
  const STORAGE_THEME = "school_dashboard_theme";
  const STORAGE_DISMISSED = "school_dashboard_canvas_dismissed";
  const STORAGE_ALIASES = "school_dashboard_tag_aliases";
  const STORAGE_SEEDED = "school_dashboard_seeded_tags";
  const STORAGE_UI = "school_dashboard_ui";
  const STORAGE_BACKUP_HOLD = "school_dashboard_backup_hold";
  const REFRESH_URL = (location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8765") + "/refresh";
  const PL_ORIGIN = "https://us.prairielearn.com";

  const DEFAULT_CATEGORIES = { class: [], extra: [] };

  let tasks = [];
  let categories = { class: [], extra: [] };
  let aliases = {};            // old tag name -> current name, so Canvas keeps landing in a renamed tag
  let ui = { view: "timeline", classFilter: "open" };
  let tagFilter = null;
  let editingTags = false;
  let addingTagGroup = null;
  let secondaryTab = "later";
  let addingCardTag = null;
  const expandedLater = new Set();
  let draggedTaskId = null;
  let draggedTag = null;
  let calYear, calMonth, selectedDate;

  /* ---------- helpers ---------- */

  const $ = id => document.getElementById(id);
  const pad2 = n => String(n).padStart(2, "0");
  function localISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayISO() { return localISO(new Date()); }
  function parseISO(s) { return new Date(s + "T00:00:00"); }
  function daysUntil(s) {
    if (!s) return null;
    return Math.round((parseISO(s) - parseISO(todayISO())) / 86400000);
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function allTags() { return categories.class.concat(categories.extra); }
  function tagType(tag) { return categories.class.includes(tag) ? "class" : "extra"; }
  function resolveTag(tag) { return aliases[tag] || tag; }
  function getMaxOrder() { return tasks.reduce((max, t) => Math.max(max, t.order || 0), -1); }
  function newId() { return Date.now().toString() + Math.random().toString(36).slice(2, 7); }

  function dueLabel(dateStr) {
    const d = daysUntil(dateStr);
    if (d === null) return { text: "No date", cls: "pill-later" };
    if (d < 0) return { text: Math.abs(d) + "d overdue", cls: "pill-overdue" };
    if (d === 0) return { text: "Today", cls: "pill-today" };
    if (d === 1) return { text: "Tomorrow", cls: "pill-week" };
    if (d <= 7) return { text: parseISO(dateStr).toLocaleDateString("en-US", { weekday: "short" }), cls: "pill-week" };
    return { text: parseISO(dateStr).toLocaleDateString("en-US", { month: "short", day: "numeric" }), cls: "pill-later" };
  }

  // Only plain web links are allowed. PrairieLearn stores site-relative paths.
  function safeUrl(t) {
    if (!t.url) return null;
    if (t.url.startsWith("/")) return PL_ORIGIN + t.url;
    return /^https:\/\//i.test(t.url) ? t.url : null;
  }

  let toastTimer;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
  }

  /* ---------- theme ---------- */

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    $("theme-icon").textContent = theme === "dark" ? "☾" : "☀";
    $("theme-label").textContent = theme === "dark" ? "Dark" : "Light";
    try { localStorage.setItem(STORAGE_THEME, theme); } catch (e) {}
  }
  function loadTheme() {
    try {
      const saved = localStorage.getItem(STORAGE_THEME);
      if (saved === "dark" || saved === "light") return applyTheme(saved);
    } catch (e) {}
    applyTheme(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function toggleTheme() {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  }

  /* ---------- storage ---------- */

  function readJSON(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
  }
  const saveTasks = () => { writeJSON(STORAGE_TASKS, tasks); scheduleBackup(); };
  const saveCategories = () => { writeJSON(STORAGE_CATEGORIES, categories); scheduleBackup(); };
  const saveAliases = () => { writeJSON(STORAGE_ALIASES, aliases); scheduleBackup(); };
  const saveUI = () => writeJSON(STORAGE_UI, ui);

  /* ---------- backups ---------- */
  // The browser's own storage can be cleared, so the helper keeps a copy on disk (data/backups/).

  const BACKUP_URL = (location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8765") + "/backup";
  let backupsPaused = true;   // stays true until the restore offer on a fresh browser is settled
  let backupTimer;

  function snapshot() {
    return {
      tasks, categories, aliases,
      dismissed: readJSON(STORAGE_DISMISSED, []),
      seeded: readJSON(STORAGE_SEEDED, []),
      exported: new Date().toISOString()
    };
  }

  async function saveBackup() {
    if (backupsPaused) {
      return { ok: false, error: "paused, because this browser started empty and the older backup was kept. Use Restore from backup to bring those tasks back" };
    }
    try {
      const res = await fetch(BACKUP_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(snapshot()) });
      const body = await res.json();
      return body.ok ? { ok: true, count: body.count } : { ok: false, error: body.error || "it was not saved" };
    } catch (err) {
      return { ok: false, error: "the helper is not reachable" };
    }
  }

  function scheduleBackup() {
    if (backupsPaused) return;
    clearTimeout(backupTimer);
    backupTimer = setTimeout(saveBackup, 4000);
  }

  async function fetchLatestBackup() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    try {
      const res = await fetch(BACKUP_URL + "/latest", { signal: ctrl.signal });
      if (!res.ok) return null;
      const data = await res.json();
      return Array.isArray(data.tasks) && data.tasks.length ? data : null;
    } catch (err) {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  function describeBackup(b) {
    const open = b.tasks.filter(t => !t.done).length;
    return b.tasks.length + " tasks (" + open + " open), saved " + (b.saved ? ago(b.saved) : "at an unknown time");
  }

  // Set when the user keeps an older backup instead of restoring it, and cleared by a restore.
  // It survives reloads, so this browser cannot overwrite that backup later.
  function setBackupHold(on) {
    try {
      if (on) localStorage.setItem(STORAGE_BACKUP_HOLD, "1");
      else localStorage.removeItem(STORAGE_BACKUP_HOLD);
    } catch (e) {}
  }
  function backupHeld() {
    try { return localStorage.getItem(STORAGE_BACKUP_HOLD) === "1"; } catch (e) { return false; }
  }

  function applySnapshot(data) {
    setBackupHold(false);
    tasks = data.tasks;
    categories = data.categories;
    aliases = data.aliases || {};
    writeJSON(STORAGE_DISMISSED, data.dismissed || readJSON(STORAGE_DISMISSED, []));
    if (data.seeded) writeJSON(STORAGE_SEEDED, data.seeded);
    saveTasks(); saveCategories(); saveAliases();
    loadData();
  }

  async function restoreFromBackup() {
    const b = await fetchLatestBackup();
    if (!b) { toast("No backup found on this computer yet."); return; }
    if (!confirm("Replace the tasks in this browser with the backup of " + describeBackup(b) + "?")) return;
    applySnapshot(b);
    backupsPaused = false;
    toast("Restored " + b.tasks.length + " tasks.");
  }

  // A browser that has never held tasks, such as after clearing site data, offers the backup first.
  // Resolves to true when backups must stay paused so this browser cannot overwrite the older backup.
  async function offerRestoreOnFreshBrowser() {
    let fresh = false;
    try { fresh = localStorage.getItem(STORAGE_TASKS) === null; } catch (e) {}
    if (!fresh) return backupHeld();
    const b = await fetchLatestBackup();
    if (!b) return false;
    if (confirm("This browser has no saved tasks, but a backup with " + describeBackup(b) + " is on your computer. Restore it?")) {
      applySnapshot(b);
      return false;
    }
    const keepOld = !confirm("Start fresh instead? OK replaces the older backup with this browser's tasks from now on. Cancel keeps the older backup safe and pauses backups in this browser.");
    setBackupHold(keepOld);
    return keepOld;
  }

  function loadData() {
    tasks = readJSON(STORAGE_TASKS, []);
    if (!Array.isArray(tasks)) tasks = [];
    tasks.forEach((t, i) => { if (t.order === undefined) t.order = i; });
    categories = readJSON(STORAGE_CATEGORIES, JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)));
    if (!categories.class || !categories.extra) categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    aliases = readJSON(STORAGE_ALIASES, {});
    const saved = readJSON(STORAGE_UI, null);
    if (saved) ui = Object.assign(ui, saved);
    mergeCanvasTasks();
    render();
  }

  /* ---------- Canvas merge ---------- */

  function loadDismissed() { return readJSON(STORAGE_DISMISSED, []); }
  function dismissCanvasId(canvasId) {
    const list = loadDismissed();
    if (!list.includes(canvasId)) { list.push(canvasId); writeJSON(STORAGE_DISMISSED, list); }
  }

  // Merges tasks from canvas_tasks.js. Fields you edited by hand are left alone,
  // tasks you deleted stay deleted, and renamed tags keep receiving their tasks.
  function mergeCanvasTasks() {
    const feed = window.CANVAS_TASKS;
    if (!feed || !Array.isArray(feed.tasks)) return;

    const dismissed = new Set(loadDismissed());
    const seeded = new Set(readJSON(STORAGE_SEEDED, []));
    let tasksChanged = false, categoriesChanged = false, seededChanged = false;

    const ensureTag = tag => {
      if (!allTags().includes(tag)) { categories.class.push(tag); categoriesChanged = true; }
    };

    // Starter tags are added once, so deleting one does not bring it back.
    (feed.tags || []).forEach(raw => {
      if (seeded.has(raw)) return;
      seeded.add(raw); seededChanged = true;
      ensureTag(resolveTag(raw));
    });

    feed.tasks.forEach(ct => {
      if (dismissed.has(ct.canvasId)) return;
      const tag = resolveTag(ct.tag);
      const existing = tasks.find(t => t.canvasId === ct.canvasId);

      if (!existing) {
        ensureTag(tag);
        tasks.push({
          id: newId(), name: ct.name, tag, date: ct.date, done: false,
          order: getMaxOrder() + 1, created: new Date().toISOString(),
          canvasId: ct.canvasId, canvasName: ct.name, canvasDate: ct.date, canvasTag: ct.tag, url: ct.url
        });
        tasksChanged = true;
        return;
      }

      [["name", "canvasName"], ["date", "canvasDate"]].forEach(([field, snap]) => {
        if (existing[snap] === ct[field]) return;
        if (existing[field] === existing[snap]) existing[field] = ct[field];
        existing[snap] = ct[field];
        tasksChanged = true;
      });
      if (existing.canvasTag !== ct.tag) {
        if (existing.tag === resolveTag(existing.canvasTag)) existing.tag = tag;
        existing.canvasTag = ct.tag;
        tasksChanged = true;
      }
      if (existing.url !== ct.url) { existing.url = ct.url; tasksChanged = true; }
    });

    if (tasksChanged) saveTasks();
    if (categoriesChanged) saveCategories();
    if (seededChanged) writeJSON(STORAGE_SEEDED, Array.from(seeded));

    const status = $("canvas-sync-status");
    if (feed.generated) {
      const when = new Date(feed.generated).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      status.textContent = "Calendars synced " + when + ".";
    }
  }

  /* ---------- refresh ---------- */

  function reloadFeedScript() {
    return new Promise((resolve, reject) => {
      const el = document.createElement("script");
      el.src = "canvas_tasks.js?t=" + Date.now();
      el.onload = () => { el.remove(); resolve(); };
      el.onerror = () => { el.remove(); reject(new Error("feed")); };
      document.head.appendChild(el);
    });
  }

  // The browser extension (extension/) answers this when installed.
  // Resolves to null without the extension, otherwise to { ok, sources, error }.
  function refreshExtension() {
    if (document.documentElement.dataset.plExtension !== "1") return Promise.resolve(null);
    return new Promise(resolve => {
      const finish = result => {
        document.removeEventListener("dashboard:pl-done", onDone);
        clearTimeout(timer);
        resolve(result);
      };
      const onDone = e => finish(e.detail || { ok: false, error: "No answer" });
      const timer = setTimeout(() => finish({ ok: false, error: "Timed out" }), 60000);
      document.addEventListener("dashboard:pl-done", onDone);
      document.dispatchEvent(new CustomEvent("dashboard:pl-refresh"));
    });
  }

  function ago(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 2) return "just now";
    if (mins < 90) return mins + " min ago";
    const hours = Math.round(mins / 60);
    if (hours < 36) return hours + " h ago";
    return Math.round(hours / 24) + " days ago";
  }

  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  // One chip per source, so a failure is never hidden behind a success elsewhere.
  // `report` comes from the helper (every Canvas feed, plus the last data each extension site sent).
  // `ext` is what the extension said just now: null when it was not detected on this page.
  function syncChips(report, ext) {
    const chips = [];
    let bad = 0;
    const chip = (cls, html) => {
      if (cls === "bad" || cls === "warn") bad += 1;
      chips.push('<span class="sync-chip ' + cls + '">' + html + "</span>");
    };

    (report || []).forEach(src => {
      const label = escapeHtml(src.label);
      if (src.kind === "backup") {
        if (src.ok) chip("ok", "<b>✓</b> " + label + " · " + plural(src.count, "task") + " saved on this computer");
        else chip("bad", "⚠ " + label + ": " + escapeHtml(src.error));
        return;
      }
      if (src.kind === "calendar") {
        if (src.ok) chip("ok", "<b>✓</b> " + label + " · " + plural(src.count, "assignment"));
        else chip("bad", "⚠ " + label + ": " + escapeHtml(src.error || "could not be read"));
        return;
      }

      const live = ext && ext.sources && ext.sources[src.site];
      const lastSynced = src.updated ? "Showing data from " + ago(src.updated) + "." : "Nothing synced yet.";
      if (!ext) {
        chip("bad", "⚠ " + label + ": browser extension not detected on this page. " + lastSynced +
          " Reload the extension, make sure its site access is on in about:addons, then reload this page.");
      } else if (live && live.ok && live.warnings && live.warnings.length) {
        chip("warn", "⚠ " + label + " · " + plural(src.count, "assignment") + ". " + live.warnings.map(escapeHtml).join(". ") + ".");
      } else if (live && live.ok) {
        const skipped = live.skipped ? " (" + live.skipped + " without a deadline)" : "";
        chip("ok", "<b>✓</b> " + label + " · " + plural(src.count, "assignment") + skipped);
      } else {
        const error = (live && live.error) || ext.error || "";
        let why;
        if (/not signed in/i.test(error)) why = "needs a sign-in. Log in to it in your browser and refresh again.";
        else if (/site access is off/i.test(error)) why = "site access is off. Open about:addons, choose this extension, turn on its site toggles on the Permissions tab, then refresh.";
        else if (/layout may have changed/i.test(error)) why = escapeHtml(error) + ".";
        else if (/context invalidated|receiving end|Timed out|No answer/i.test(error)) why = "the extension is not responding. Reload this page and try again.";
        else why = "did not sync" + (error ? " (" + escapeHtml(error) + ")" : "") + ".";
        chip("bad", "⚠ " + label + ": " + why + " " + lastSynced);
      }
    });
    return { html: chips.join(""), bad, total: chips.length };
  }

  function setSyncPanel(open) {
    $("sync-report").hidden = !open;
    $("sync-summary").setAttribute("aria-expanded", String(open));
  }

  // A one-line summary stays in place. Details open on click, and open by themselves on a failure.
  function showSyncReport(report, ext) {
    const { html, bad, total } = syncChips(report, ext);
    const btn = $("sync-summary");
    $("sync-report").innerHTML = html;
    btn.hidden = false;
    btn.classList.toggle("bad", bad > 0);
    btn.innerHTML = bad
      ? "⚠ " + bad + " of " + total + " sources " + (bad === 1 ? "needs" : "need") + " attention"
      : "<b>✓</b> All " + total + " sources synced";
    setSyncPanel(bad > 0);
  }

  function clearSyncReport() {
    $("sync-summary").hidden = true;
    $("sync-report").innerHTML = "";
    setSyncPanel(false);
  }

  async function refreshFromCanvas() {
    const btn = $("refresh-btn");
    const status = $("canvas-sync-status");
    const before = tasks.length;
    btn.disabled = true;
    btn.textContent = "Refreshing...";
    status.textContent = "";
    clearSyncReport();
    try {
      const ext = await refreshExtension();
      let body;
      try {
        const res = await fetch(REFRESH_URL, { method: "POST" });
        body = await res.json();
      } catch (err) {
        status.textContent = "Refresh helper is not running. Start it with scripts/dashboard_server.py.";
        return;
      }
      if (!body.ok) {
        status.textContent = "Refresh failed: " + (body.error || "unknown error") + ".";
        return;
      }
      await reloadFeedScript();
      mergeCanvasTasks();
      render();
      const added = tasks.length - before;
      status.textContent += " " + (added > 0 ? plural(added, "new task") + " added." : "No new assignments.");
      const backupResult = await saveBackup();
      showSyncReport(body.sources.concat([Object.assign({ label: "Task backup", kind: "backup" }, backupResult)]), ext);
    } catch (err) {
      status.textContent = "Refresh did not finish (" + (err.message || err) + ").";
    } finally {
      btn.disabled = false;
      btn.textContent = "Refresh";
    }
  }

  /* ---------- selectors ---------- */

  const scoped = () => tagFilter ? tasks.filter(t => t.tag === tagFilter) : tasks;
  const isOpen = t => !t.done;
  const getOverdue = () => scoped().filter(t => isOpen(t) && t.date && daysUntil(t.date) < 0);
  const getToday = () => scoped().filter(t => isOpen(t) && t.date && daysUntil(t.date) === 0);
  const getNext7 = () => scoped().filter(t => isOpen(t) && t.date && daysUntil(t.date) > 0 && daysUntil(t.date) <= 7);
  const getLater = () => scoped().filter(t => isOpen(t) && (!t.date || daysUntil(t.date) > 7));
  const getDone = () => scoped().filter(t => t.done);
  const getOpen = () => scoped().filter(isOpen);
  const byOrder = list => list.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  function byDate(list) {
    return list.slice().sort((a, b) => {
      if (!a.date && !b.date) return (a.order || 0) - (b.order || 0);
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date.localeCompare(b.date) || (a.order || 0) - (b.order || 0);
    });
  }

  /* ---------- tag operations ---------- */

  function renameTag(oldName, rawNew) {
    const newName = rawNew.trim();
    if (!newName || newName === oldName) return true;
    if (allTags().includes(newName)) { toast("Another class or extracurricular already uses that name."); return false; }
    ["class", "extra"].forEach(g => { categories[g] = categories[g].map(t => t === oldName ? newName : t); });
    tasks.forEach(t => { if (t.tag === oldName) t.tag = newName; });
    Object.keys(aliases).forEach(k => { if (aliases[k] === oldName) aliases[k] = newName; });
    delete aliases[newName];
    aliases[oldName] = newName;
    if (tagFilter === oldName) tagFilter = newName;
    saveTasks(); saveCategories(); saveAliases();
    return true;
  }

  function addTag(group, rawName) {
    const name = rawName.trim();
    if (!name) return;
    if (allTags().includes(name)) { toast("That name is already in use."); return; }
    categories[group].push(name);
    delete aliases[name];
    saveCategories(); saveAliases();
  }

  function deleteTag(tag) {
    const inUse = tasks.filter(t => t.tag === tag && !t.done).length;
    const msg = inUse > 0
      ? '"' + tag + '" has ' + inUse + ' open task(s). Delete anyway? They move to an "Other" card in the By class view.'
      : 'Delete "' + tag + '"?';
    if (!confirm(msg)) return;
    ["class", "extra"].forEach(g => { categories[g] = categories[g].filter(t => t !== tag); });
    if (tagFilter === tag) tagFilter = null;
    saveCategories();
    render();
  }

  function moveTag(name, toGroup, refTag, after) {
    ["class", "extra"].forEach(g => { categories[g] = categories[g].filter(t => t !== name); });
    const arr = categories[toGroup];
    let idx = refTag ? arr.indexOf(refTag) : -1;
    idx = idx < 0 ? arr.length : idx + (after ? 1 : 0);
    arr.splice(idx, 0, name);
    saveCategories();
    render();
  }

  /* ---------- rendering: shared pieces ---------- */

  function taskHTML(t, opts) {
    opts = opts || {};
    const due = dueLabel(t.date);
    const link = safeUrl(t);
    return '<div class="task ' + (t.done ? "done" : "") + '" data-id="' + t.id + '"' + (opts.grip ? ' draggable="true"' : "") + '>' +
      (opts.grip ? '<span class="grip" title="Drag to reorder">⋮⋮</span>' : "") +
      '<button class="check ' + (t.done ? "checked" : "") + '" data-action="toggle" data-id="' + t.id + '" aria-label="Mark done"></button>' +
      '<span class="task-name" data-action="edit-name" data-id="' + t.id + '" title="' + escapeHtml(t.name) + '">' + escapeHtml(t.name) + '</span>' +
      (opts.showTag === false ? "" : '<span class="pill tag-' + tagType(t.tag) + '" data-action="edit-tag" data-id="' + t.id + '">' + escapeHtml(t.tag) + '</span>') +
      '<span class="pill ' + due.cls + '" data-action="edit-date" data-id="' + t.id + '">' + due.text + '</span>' +
      '<span class="link-slot">' + (link ? '<a class="open-link" href="' + escapeHtml(link) + '" target="_blank" rel="noopener noreferrer" title="Open in the original site">↗</a>' : "") + '</span>' +
      '<button class="x" data-action="delete" data-id="' + t.id + '" aria-label="Delete task">×</button>' +
    '</div>';
  }

  function tagOptionsHTML(selected) {
    let html = "";
    if (categories.class.length) {
      html += '<optgroup label="Classes">' + categories.class.map(t => '<option value="' + escapeHtml(t) + '"' + (t === selected ? " selected" : "") + ">" + escapeHtml(t) + "</option>").join("") + "</optgroup>";
    }
    if (categories.extra.length) {
      html += '<optgroup label="Extracurriculars">' + categories.extra.map(t => '<option value="' + escapeHtml(t) + '"' + (t === selected ? " selected" : "") + ">" + escapeHtml(t) + "</option>").join("") + "</optgroup>";
    }
    return html;
  }

  function renderTagSelect() {
    const sel = $("new-tag");
    const prev = sel.value;
    sel.innerHTML = tagOptionsHTML(null);
    if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
    else if (tagFilter) sel.value = tagFilter;
  }

  function renderTags() {
    if (tagFilter && !allTags().includes(tagFilter)) tagFilter = null;
    ["class", "extra"].forEach(group => {
      const row = $(group + "-tags");
      const chips = categories[group].map(tag => {
        const count = tasks.filter(t => !t.done && t.tag === tag).length;
        const name = editingTags
          ? '<input class="tag-input" data-tag="' + escapeHtml(tag) + '" value="' + escapeHtml(tag) + '" style="width:' + Math.max(4, tag.length + 1) + 'ch" aria-label="Rename ' + escapeHtml(tag) + '">'
          : '<span class="tag-name">' + escapeHtml(tag) + "</span>";
        return '<div class="tag-chip ' + group + (tagFilter === tag ? " active" : "") + '" draggable="true" data-tag="' + escapeHtml(tag) + '" data-group="' + group + '"' +
          (editingTags ? "" : ' data-action="filter-tag"') + ">" +
          '<span class="grip" title="Drag to reorder">⋮⋮</span>' + name +
          '<span class="tag-count">' + count + "</span>" +
          (editingTags ? '<button class="tag-x" data-action="delete-tag" data-tag="' + escapeHtml(tag) + '" aria-label="Delete ' + escapeHtml(tag) + '">×</button>' : "") +
        "</div>";
      }).join("");
      const adder = addingTagGroup === group
        ? '<input class="new-tag-input" data-group="' + group + '" placeholder="Name" style="width:12ch">'
        : '<button class="tag-add" data-action="add-tag" data-group="' + group + '">+ Add ' + (group === "class" ? "class" : "extracurricular") + "</button>";
      row.innerHTML = chips + adder;
    });
    $("edit-tags").textContent = editingTags ? "Done" : "Edit";
    $("clear-filter").hidden = !tagFilter;
    $("filter-note").innerHTML = tagFilter ? '<span class="count">Showing ' + escapeHtml(tagFilter) + "</span>" : "";
    if (addingTagGroup) {
      const input = document.querySelector(".new-tag-input");
      if (input) input.focus();
    }
  }

  /* ---------- rendering: timeline ---------- */

  function renderTaskList(containerId, list, emptyMsg) {
    const el = $(containerId);
    const sorted = byOrder(list);
    el.innerHTML = sorted.length ? sorted.map(t => taskHTML(t, { grip: true })).join("") : '<div class="empty">' + emptyMsg + "</div>";
  }

  function renderTimeline() {
    const overdue = byOrder(getOverdue());
    $("overdue-section").hidden = overdue.length === 0;
    $("overdue-count").textContent = overdue.length || "";
    $("overdue-list").innerHTML = overdue.map(t => taskHTML(t, { grip: true })).join("");

    const today = getToday(), week = getNext7();
    $("today-count").textContent = today.length || "";
    $("week-count").textContent = week.length || "";
    renderTaskList("today-list", today, "Nothing due today.");
    renderTaskList("week-list", week, "Nothing due in the next 7 days.");

    document.querySelectorAll("#secondary-tabs .tab").forEach(b => b.classList.toggle("active", b.dataset.filter === secondaryTab));
    if (secondaryTab === "later") renderTaskList("secondary-list", getLater(), "Nothing scheduled further out.");
    else if (secondaryTab === "done") renderTaskList("secondary-list", getDone(), "Nothing done yet.");
    else renderTaskList("secondary-list", getOpen(), "No open tasks.");
  }

  /* ---------- rendering: by class ---------- */

  const CLASS_FILTERS = [
    { key: "open", label: "All open" },
    { key: "overdue", label: "Overdue" },
    { key: "today", label: "Today" },
    { key: "week", label: "Next 7 days" },
    { key: "later", label: "Later" },
    { key: "done", label: "Done" }
  ];

  function filterCounts() {
    return { open: getOpen().length, overdue: getOverdue().length, today: getToday().length, week: getNext7().length, later: getLater().length, done: getDone().length };
  }

  function cardTasks(tag) {
    const f = ui.classFilter;
    const mine = scoped().filter(t => t.tag === tag);
    if (f === "done") return { shown: byDate(mine.filter(t => t.done)), later: [] };
    const open = mine.filter(isOpen);
    if (f === "overdue") return { shown: byDate(open.filter(t => t.date && daysUntil(t.date) < 0)), later: [] };
    if (f === "today") return { shown: byDate(open.filter(t => t.date && daysUntil(t.date) === 0)), later: [] };
    if (f === "week") return { shown: byDate(open.filter(t => t.date && daysUntil(t.date) > 0 && daysUntil(t.date) <= 7)), later: [] };
    if (f === "later") return { shown: byDate(open.filter(t => !t.date || daysUntil(t.date) > 7)), later: [] };
    const near = open.filter(t => t.date && daysUntil(t.date) <= 7);
    const far = open.filter(t => !t.date || daysUntil(t.date) > 7);
    return { shown: byDate(near), later: byDate(far) };
  }

  function cardHTML(tag, group) {
    const { shown, later } = cardTasks(tag);
    const f = ui.classFilter;
    const open = tasks.filter(t => !t.done && t.tag === tag);
    const overdueN = open.filter(t => t.date && daysUntil(t.date) < 0).length;
    const draggable = group !== "other";
    let body = shown.map(t => taskHTML(t, { showTag: false })).join("");
    if (later.length) {
      const expanded = expandedLater.has(tag);
      body += '<button class="later-toggle" data-action="toggle-later" data-tag="' + escapeHtml(tag) + '">' + (expanded ? "Hide later" : "+ " + later.length + " later") + "</button>";
      if (expanded) body += later.map(t => taskHTML(t, { showTag: false })).join("");
    }
    if (!shown.length && !later.length) body = '<div class="card-empty">' + (f === "open" ? "All clear." : "Nothing here.") + "</div>";

    let foot = "";
    if (group !== "other") {
      foot = addingCardTag === tag
        ? '<form class="card-form" data-form="card-add" data-tag="' + escapeHtml(tag) + '"><input class="field" name="name" placeholder="New task" autocomplete="off"><input class="field" type="date" name="date" value="' + todayISO() + '"><button class="btn small primary" type="submit">Add</button></form>'
        : '<button class="card-add" data-action="card-add" data-tag="' + escapeHtml(tag) + '">+ Add task</button>';
    }
    return '<article class="class-card ' + group + '"' + (draggable ? ' data-tag="' + escapeHtml(tag) + '" data-group="' + group + '"' : "") + ">" +
      '<div class="card-head"' + (draggable ? ' draggable="true" title="Drag to reorder"' : "") + ">" +
        '<span class="name">' + escapeHtml(tag) + "</span>" +
        (overdueN ? '<span class="badge overdue">' + overdueN + " overdue</span>" : "") +
        '<span class="badge open">' + open.length + " open</span>" +
      "</div>" +
      '<div class="card-body">' + body + "</div>" +
      (foot ? '<div class="card-foot">' + foot + "</div>" : "") +
    "</article>";
  }

  /* ---------- by class: fitting the cards on screen ---------- */

  const CARD_MIN = 235, CARD_GAP = 14;
  let lastMaxCols = 0;

  function maxColsFor(width) { return Math.max(1, Math.floor((width + CARD_GAP) / (CARD_MIN + CARD_GAP))); }

  // Columns for n cards: the fewest rows, then the fewest empty slots, then the most columns.
  function bestColumns(n, maxCols) {
    let pick = 1, bestRows = Infinity, bestEmpty = Infinity;
    for (let c = Math.min(n, maxCols); c >= 1; c--) {
      const rows = Math.ceil(n / c), empty = rows * c - n;
      if (rows < bestRows || (rows === bestRows && empty < bestEmpty)) { pick = c; bestRows = rows; bestEmpty = empty; }
    }
    return pick;
  }

  // Classes and extracurriculars share a row when that needs fewer rows than stacking them.
  // Whatever is left over in a last row stretches to fill it, so odd counts leave no hole.
  function planLayout(n1, n2, maxCols) {
    const c1s = bestColumns(n1, maxCols), c2s = bestColumns(n2, maxCols);
    let best = { side: false, c1: c1s, c2: c2s };
    if (!n1 || !n2) return best;
    // A tie goes to side by side when a group is small, since stacking would stretch it across the row.
    let bestRows = Math.ceil(n1 / c1s) + Math.ceil(n2 / c2s) + (Math.min(n1, n2) <= 2 ? 1 : 0);
    let bestEmpty = Infinity, bestSpan = Infinity;
    for (let c1 = 1; c1 <= Math.min(n1, maxCols - 1); c1++) {
      for (let c2 = 1; c2 <= Math.min(n2, maxCols - c1); c2++) {
        const r1 = Math.ceil(n1 / c1), r2 = Math.ceil(n2 / c2);
        const rows = Math.max(r1, r2), empty = r1 * c1 - n1 + r2 * c2 - n2, span = c1 + c2;
        const better = rows < bestRows ||
          (best.side && rows === bestRows && (empty < bestEmpty || (empty === bestEmpty && span < bestSpan)));
        if (better) { best = { side: true, c1, c2 }; bestRows = rows; bestEmpty = empty; bestSpan = span; }
      }
    }
    return best;
  }

  function renderClasses() {
    const counts = filterCounts();
    $("class-filters").innerHTML = CLASS_FILTERS.map(c =>
      '<button class="fchip ' + (ui.classFilter === c.key ? "active" : "") + '" data-action="set-class-filter" data-filter="' + c.key + '">' + c.label + '<span class="n">' + counts[c.key] + "</span></button>").join("");

    const hideEmpty = ui.classFilter !== "open";
    const visibleTags = group => categories[group].filter(tag => {
      if (tagFilter && tag !== tagFilter) return false;
      if (!hideEmpty) return true;
      const r = cardTasks(tag);
      return r.shown.length || r.later.length;
    });

    const main = ["class", "extra"]
      .map(group => ({ group, tags: visibleTags(group) }))
      .filter(g => g.tags.length || !hideEmpty);

    const maxCols = maxColsFor($("class-cards").clientWidth || 1052);
    lastMaxCols = maxCols;
    const count = key => (main.find(g => g.group === key) || { tags: [] }).tags.length;
    const plan = planLayout(count("class"), count("extra"), maxCols);
    const cols = { class: plan.c1, extra: plan.c2 };
    const span = plan.c1 + plan.c2;

    const groupHTML = (label, group, tagList, c, style) =>
      '<section class="group"' + (style ? ' style="' + style + '"' : "") + ">" +
      '<div class="section-label">' + label + "</div>" +
      '<div class="cards-row"' + (group !== "other" ? ' data-group="' + group + '"' : "") + ' style="--c:' + c + '">' +
      tagList.map(t => cardHTML(t, group)).join("") + "</div></section>";

    let html = "";
    if (main.length) {
      html += '<div class="groups ' + (plan.side ? "side" : "stacked") + '">' + main.map(g => {
        const c = cols[g.group];
        // Side by side, each group takes a share of the row equal to its column count.
        const style = plan.side ? "flex: 0 0 calc((100% - " + (span - 1) * CARD_GAP + "px) / " + span + " * " + c + " + " + (c - 1) * CARD_GAP + "px)" : "";
        return groupHTML(g.group === "class" ? "Classes" : "Extracurriculars", g.group, g.tags, c, style);
      }).join("") + "</div>";
    }

    const known = new Set(allTags());
    const orphanTags = Array.from(new Set(scoped().filter(t => !known.has(t.tag)).map(t => t.tag)));
    const orphanShown = orphanTags.filter(tag => { const r = cardTasks(tag); return !hideEmpty || r.shown.length || r.later.length; });
    if (orphanShown.length) {
      html += '<div class="groups stacked">' + groupHTML("Other", "other", orphanShown, bestColumns(orphanShown.length, maxCols), "") + "</div>";
    }
    if (!html) html = '<div class="card"><div class="empty">' + (allTags().length ? "Nothing matches this filter." : "Add a class or extracurricular above to get started. Canvas classes appear after a sync.") + "</div></div>";
    $("class-cards").innerHTML = html;

    if (addingCardTag) {
      const input = document.querySelector('[data-form="card-add"] input[name="name"]');
      if (input) input.focus();
    }
  }

  /* ---------- rendering: calendar ---------- */

  function renderCalendar() {
    if (calYear === undefined) {
      const now = new Date();
      calYear = now.getFullYear(); calMonth = now.getMonth();
    }
    if (!selectedDate) selectedDate = todayISO();
    $("cal-title").textContent = new Date(calYear, calMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });

    const first = new Date(calYear, calMonth, 1);
    const lead = first.getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const weeks = Math.ceil((lead + daysInMonth) / 7);

    const byDay = {};
    scoped().forEach(t => { if (t.date) (byDay[t.date] = byDay[t.date] || []).push(t); });

    const today = todayISO();
    let html = "";
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(calYear, calMonth, 1 - lead + i);
      const iso = localISO(d);
      const list = byDay[iso] || [];
      const open = list.filter(isOpen), done = list.filter(t => t.done);
      const ordered = open.concat(done);
      const chips = ordered.slice(0, 3).map(t =>
        '<span class="cal-chip tag-' + tagType(t.tag) + (t.done ? " done" : "") + (isOpen(t) && daysUntil(t.date) < 0 ? " late" : "") + '" draggable="true" data-id="' + t.id + '" title="' + escapeHtml(t.tag + ": " + t.name) + '"><b>' + escapeHtml(t.tag) + "</b>" + escapeHtml(t.name) + "</span>").join("");
      const more = ordered.length > 3 ? '<div class="cal-more">+' + (ordered.length - 3) + " more</div>" : "";
      html += '<div class="cal-cell' + (d.getMonth() !== calMonth ? " other" : "") + (iso === today ? " today" : "") + (iso === selectedDate ? " selected" : "") + '" data-action="select-day" data-date="' + iso + '">' +
        '<div class="cal-num">' + d.getDate() + "</div>" + chips + more + "</div>";
    }
    $("cal-grid").innerHTML = html;
    renderDayPanel();
  }

  function renderDayPanel() {
    const title = parseISO(selectedDate).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    const list = byOrder(scoped().filter(t => t.date === selectedDate));
    const defaultTag = tagFilter || categories.class[0] || categories.extra[0];
    $("day-panel").innerHTML =
      '<div class="day-head"><h2>' + title + ' <span class="count">' + (list.length || "") + "</span></h2></div>" +
      '<div class="task-list">' + (list.length ? list.map(t => taskHTML(t)).join("") : '<div class="empty">Nothing on this day.</div>') + "</div>" +
      (allTags().length
        ? '<form class="day-form" data-form="day-add"><input class="field" name="name" placeholder="Add a task for this day" autocomplete="off"><select class="field" name="tag">' + tagOptionsHTML(defaultTag) + '</select><button class="btn primary" type="submit">Add</button></form>'
        : "");
  }

  /* ---------- render ---------- */

  function render() {
    renderTags();
    renderTagSelect();
    document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== "view-" + ui.view; });
    document.querySelectorAll("#view-switch button").forEach(b => b.classList.toggle("active", b.dataset.view === ui.view));
    if (ui.view === "timeline") renderTimeline();
    else if (ui.view === "classes") renderClasses();
    else renderCalendar();
  }

  /* ---------- task operations ---------- */

  function createTask(name, tag, date) {
    name = name.trim();
    if (!name || !tag) return false;
    tasks.push({ id: newId(), name, tag, date: date || null, done: false, order: getMaxOrder() + 1, created: new Date().toISOString() });
    saveTasks();
    return true;
  }
  function toggleTask(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = !t.done; saveTasks(); render(); }
  }
  function deleteTask(id) {
    const gone = tasks.find(t => t.id === id);
    if (gone && gone.canvasId) dismissCanvasId(gone.canvasId);
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }

  function startEditName(id, el) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const input = document.createElement("input");
    input.className = "task-name-input";
    input.value = task.name;
    el.replaceWith(input);
    input.focus(); input.select();
    let cancelled = false;
    input.addEventListener("blur", () => {
      if (!cancelled) { const v = input.value.trim(); if (v) { task.name = v; saveTasks(); } }
      render();
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      else if (e.key === "Escape") { cancelled = true; input.blur(); }
    });
  }

  function startEditDate(id, el) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const input = document.createElement("input");
    input.type = "date";
    input.className = "inline-date";
    input.value = task.date || "";
    el.replaceWith(input);
    input.focus();
    let cancelled = false;
    const finish = () => { if (!cancelled) { task.date = input.value || null; saveTasks(); } render(); };
    input.addEventListener("change", finish);
    input.addEventListener("blur", finish);
    input.addEventListener("keydown", e => { if (e.key === "Escape") { cancelled = true; input.blur(); } });
  }

  function startEditTag(id, el) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const select = document.createElement("select");
    select.className = "inline-select";
    select.innerHTML = tagOptionsHTML(task.tag);
    el.replaceWith(select);
    select.focus();
    let cancelled = false;
    const finish = () => { if (!cancelled) { task.tag = select.value; saveTasks(); } render(); };
    select.addEventListener("change", finish);
    select.addEventListener("blur", finish);
    select.addEventListener("keydown", e => { if (e.key === "Escape") { cancelled = true; select.blur(); } });
  }

  /* ---------- drag and drop ---------- */

  function clearDropMarks(root) {
    root.querySelectorAll(".drop-above, .drop-below, .drop-before, .drop-after, .drop-end, .drop-target").forEach(el =>
      el.classList.remove("drop-above", "drop-below", "drop-before", "drop-after", "drop-end", "drop-target"));
  }

  // Reorder tasks within the timeline lists.
  function setupTaskDrag(container) {
    container.addEventListener("dragstart", e => {
      const row = e.target.closest(".task");
      if (!row) return;
      draggedTaskId = row.dataset.id;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", draggedTaskId);
    });
    container.addEventListener("dragend", e => {
      const row = e.target.closest(".task");
      if (row) row.classList.remove("dragging");
      clearDropMarks(container);
      draggedTaskId = null;
    });
    container.addEventListener("dragover", e => {
      if (!draggedTaskId) return;
      e.preventDefault();
      const row = e.target.closest(".task");
      if (!row || row.dataset.id === draggedTaskId) return;
      clearDropMarks(container);
      const rect = row.getBoundingClientRect();
      row.classList.add(e.clientY < rect.top + rect.height / 2 ? "drop-above" : "drop-below");
    });
    container.addEventListener("drop", e => {
      const row = e.target.closest(".task");
      if (!row || !draggedTaskId || row.dataset.id === draggedTaskId) return;
      e.preventDefault();
      reorderTasks(draggedTaskId, row.dataset.id, row.classList.contains("drop-above"));
    });
  }

  function reorderTasks(dragId, targetId, before) {
    const a = tasks.find(t => t.id === dragId), b = tasks.find(t => t.id === targetId);
    if (!a || !b) return;
    a.order = before ? b.order - 0.5 : b.order + 0.5;
    tasks.slice().sort((x, y) => (x.order || 0) - (y.order || 0)).forEach((t, i) => { t.order = i; });
    saveTasks();
    render();
  }

  // Reorder classes and extracurriculars, in the tag list or on the cards. Dropping in the
  // other group moves the tag there.
  function setupTagDrag(container, handleSel, itemSel, rowSel) {
    container.addEventListener("dragstart", e => {
      if (e.target.closest("input")) return;
      const handle = e.target.closest(handleSel);
      const item = handle && handle.closest(itemSel);
      if (!item || !item.dataset.tag) return;
      draggedTag = item.dataset.tag;
      item.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", draggedTag);
    });
    container.addEventListener("dragend", () => {
      clearDropMarks(container);
      container.querySelectorAll(".dragging").forEach(el => el.classList.remove("dragging"));
      draggedTag = null;
    });
    container.addEventListener("dragover", e => {
      if (!draggedTag) return;
      const row = e.target.closest(rowSel);
      if (!row || !row.dataset.group) return;
      e.preventDefault();
      clearDropMarks(container);
      const item = e.target.closest(itemSel);
      if (item && item.dataset.tag && item.dataset.tag !== draggedTag) {
        const r = item.getBoundingClientRect();
        item.classList.add(e.clientX < r.left + r.width / 2 ? "drop-before" : "drop-after");
      } else if (!item) {
        row.classList.add("drop-end");
      }
    });
    container.addEventListener("drop", e => {
      if (!draggedTag) return;
      const row = e.target.closest(rowSel);
      if (!row || !row.dataset.group) return;
      e.preventDefault();
      const item = e.target.closest(itemSel);
      const name = draggedTag;
      draggedTag = null;
      if (item && item.dataset.tag && item.dataset.tag !== name) moveTag(name, row.dataset.group, item.dataset.tag, item.classList.contains("drop-after"));
      else if (!item) moveTag(name, row.dataset.group, null, true);
      else render();
    });
  }

  // Drag a chip to another day to change its due date.
  function setupCalendarDrag(grid) {
    grid.addEventListener("dragstart", e => {
      const chip = e.target.closest(".cal-chip");
      if (!chip) return;
      draggedTaskId = chip.dataset.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", draggedTaskId);
    });
    grid.addEventListener("dragend", () => { draggedTaskId = null; clearDropMarks(grid); });
    grid.addEventListener("dragover", e => {
      if (!draggedTaskId) return;
      const cell = e.target.closest(".cal-cell");
      if (!cell) return;
      e.preventDefault();
      clearDropMarks(grid);
      cell.classList.add("drop-target");
    });
    grid.addEventListener("drop", e => {
      const cell = e.target.closest(".cal-cell");
      if (!cell || !draggedTaskId) return;
      e.preventDefault();
      const task = tasks.find(t => t.id === draggedTaskId);
      draggedTaskId = null;
      if (task && task.date !== cell.dataset.date) {
        task.date = cell.dataset.date;
        selectedDate = cell.dataset.date;
        saveTasks();
      }
      render();
    });
  }

  /* ---------- backup ---------- */

  function exportBackup() {
    const data = snapshot();
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "dashboard-backup-" + todayISO() + ".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data.tasks) || !data.categories) throw new Error("Invalid backup");
        if (!confirm("This replaces all current tasks and tags. Continue?")) return;
        applySnapshot(data);
      } catch (err) {
        alert("Could not read backup file.");
      }
    };
    reader.readAsText(file);
  }

  /* ---------- events ---------- */

  function shiftMonth(delta) {
    const d = new Date(calYear, calMonth + delta, 1);
    calYear = d.getFullYear(); calMonth = d.getMonth();
    renderCalendar();
  }

  const actions = {
    "toggle": el => toggleTask(el.dataset.id),
    "delete": el => deleteTask(el.dataset.id),
    "edit-name": el => startEditName(el.dataset.id, el),
    "edit-date": el => startEditDate(el.dataset.id, el),
    "edit-tag": el => startEditTag(el.dataset.id, el),
    "set-view": el => { ui.view = el.dataset.view; saveUI(); render(); },
    "set-tab": el => { secondaryTab = el.dataset.filter; renderTimeline(); },
    "set-class-filter": el => { ui.classFilter = el.dataset.filter; saveUI(); renderClasses(); },
    "filter-tag": el => { tagFilter = tagFilter === el.dataset.tag ? null : el.dataset.tag; render(); },
    "clear-filter": () => { tagFilter = null; render(); },
    "edit-tags": () => { editingTags = !editingTags; addingTagGroup = null; renderTags(); },
    "add-tag": el => { addingTagGroup = el.dataset.group; renderTags(); },
    "delete-tag": el => deleteTag(el.dataset.tag),
    "toggle-later": el => { const t = el.dataset.tag; if (expandedLater.has(t)) expandedLater.delete(t); else expandedLater.add(t); renderClasses(); },
    "card-add": el => { addingCardTag = el.dataset.tag; renderClasses(); },
    "cal-prev": () => shiftMonth(-1),
    "cal-next": () => shiftMonth(1),
    "cal-today": () => { const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); selectedDate = todayISO(); renderCalendar(); },
    "select-day": el => { selectedDate = el.dataset.date; const d = parseISO(selectedDate); calYear = d.getFullYear(); calMonth = d.getMonth(); renderCalendar(); },
    "refresh": () => refreshFromCanvas(),
    "sync-details": () => setSyncPanel($("sync-report").hidden),
    "theme": () => toggleTheme(),
    "export": () => exportBackup(),
    "import": () => $("import-file").click(),
    "restore-backup": () => restoreFromBackup()
  };

  document.addEventListener("click", e => {
    if (!e.target.closest("#sync-report, #sync-summary")) setSyncPanel(false);
    const el = e.target.closest("[data-action]");
    if (!el || e.target.closest("a.open-link")) return;
    const fn = actions[el.dataset.action];
    if (fn) fn(el);
  });

  document.addEventListener("submit", e => {
    const form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    const data = new FormData(form);
    const kind = form.dataset.form;
    if (kind === "quick-add") {
      if (createTask(data.get("name") || "", data.get("tag"), data.get("date") || todayISO())) { form.elements.name.value = ""; render(); }
    } else if (kind === "card-add") {
      if (createTask(data.get("name") || "", form.dataset.tag, data.get("date"))) { addingCardTag = null; render(); }
    } else if (kind === "day-add") {
      if (createTask(data.get("name") || "", data.get("tag"), selectedDate)) render();
    }
  });

  // Tag rename and new-tag inputs commit when they lose focus.
  document.addEventListener("focusout", e => {
    const el = e.target;
    if (!el.classList) return;
    if (el.classList.contains("tag-input")) {
      if (!el.dataset.cancel) renameTag(el.dataset.tag, el.value);
      render();
    } else if (el.classList.contains("new-tag-input")) {
      const group = el.dataset.group;
      addingTagGroup = null;
      if (!el.dataset.cancel) addTag(group, el.value);
      render();
    }
  });
  document.addEventListener("focusin", e => {
    const chip = e.target.closest && e.target.closest(".tag-chip");
    if (chip && e.target.classList.contains("tag-input")) chip.draggable = false;
  });
  document.addEventListener("input", e => {
    if (e.target.classList && e.target.classList.contains("tag-input")) e.target.style.width = Math.max(4, e.target.value.length + 1) + "ch";
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") setSyncPanel(false);
    const el = e.target;
    if (el.classList && (el.classList.contains("tag-input") || el.classList.contains("new-tag-input"))) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
      else if (e.key === "Escape") { el.dataset.cancel = "1"; el.blur(); }
    } else if (e.key === "Escape" && addingCardTag) {
      addingCardTag = null; renderClasses();
    }
  });

  $("import-file").addEventListener("change", e => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = "";
  });

  ["overdue-list", "today-list", "week-list", "secondary-list"].forEach(id => setupTaskDrag($(id)));
  setupTagDrag($("tags-panel"), ".tag-chip", ".tag-chip", ".tag-row");
  setupTagDrag($("class-cards"), ".card-head", ".class-card", ".cards-row");
  setupCalendarDrag($("cal-grid"));

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (ui.view === "classes" && maxColsFor($("class-cards").clientWidth) !== lastMaxCols) renderClasses();
    }, 120);
  });

  loadTheme();
  $("new-date").value = todayISO();
  offerRestoreOnFreshBrowser().catch(() => false).then(keepPaused => {
    backupsPaused = keepPaused;
    loadData();
  });
})();
</script>
</body>
</html>
